# WebSocket 握手时传 Upgrade，普通请求传 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 静态资源（JS/CSS/图片）压缩
gzip on;
gzip_comp_level 5;
gzip_min_length 1k;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

# 不暴露 nginx 版本号
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS：动态解析 nginx-lb，容器重建换 IP 后无需重启本容器
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 短视频上传最高 1GB（与 server 端 multer 限制一致）
    client_max_body_size 1g;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # SPA 入口不缓存：发版后浏览器立即拿到新 index.html
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite 内容哈希静态资源（dist/assets/）：文件名带哈希，可长缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 公共反代头（与 nginx-lb 一致，保证 server 端 trust proxy 取到真实 IP）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;

    # 复用同一套后端 API，经 nginx-lb 负载均衡到各 server 副本
    location /api/ {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        # 大文件上传 + 服务端处理耗时较长，放宽代理超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 聊天 WebSocket：需要 Upgrade 头才能完成握手；长连接放宽读超时
    location /ws {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 聊天图片等上传文件静态资源
    location /uploads/ {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 种子曲库音频（assets/music 由 server 托管）
    location /assets/music/ {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
