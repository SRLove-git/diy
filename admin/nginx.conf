server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS：动态解析 nginx-lb，容器重建换 IP 后无需重启本容器
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 短视频上传最高 1GB（与 server 端 multer 限制一致）
    client_max_body_size 1g;

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 复用同一套后端 API，经 nginx-lb 负载均衡到各 server 副本
    location /api/ {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 大文件上传 + 服务端处理耗时较长，放宽代理超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 聊天 WebSocket：需要 Upgrade 头才能完成握手
    location /ws {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 聊天图片等上传文件静态资源
    location /uploads/ {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 种子曲库音频（assets/music 由 server 托管）
    location /assets/music/ {
        set $admin_upstream http://nginx-lb:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
