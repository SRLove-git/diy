# =============================================================
# Redis 7 生产/开发通用配置
# 由 docker compose 挂载：./redis/redis.conf -> /usr/local/etc/redis/redis.conf
# 修改后需重建容器生效：
#   docker compose -f docker/compose.prod.yml up -d --force-recreate redis
# maxmemory 按服务器内存调整，一般取物理内存的 1/4 ~ 1/2
# 当前生产机 14G 内存，给 1G（约 7%，覆盖会话/验证码/在线状态/缓存），compose 中 mem_limit 需同步放大到 1.5g
# =============================================================

# ---------- 基础 ----------
port 6379
# 容器内监听全部网卡，靠 compose 网络隔离（prod 未映射 6379 到宿主机），
# 因此关闭 protected mode 以允许跨容器访问（备份服务 --rdb 快照、app 直连）。
# 若需对外暴露 Redis 端口，必须改为 yes 并配置 requirepass。
protected-mode no
timeout 0
# 心跳 60s，及时清理对端已消失的 TCP 连接
tcp-keepalive 60

# ---------- 持久化：AOF 主 + RDB 兜底 ----------
appendonly yes
appendfilename "appendonly.aof"
# 每秒 fsync：崩溃最多丢 1 秒数据，性能与安全平衡（always 太慢，no 丢太多）
appendfsync everysec
# AOF 重写期间不暂停新数据的 fsync
no-appendfsync-on-rewrite no
# AOF 与 RDB 混合持久化，重启恢复更快、文件更小
aof-use-rdb-preamble yes
# 兜底 RDB 快照：满足任一条件自动保存
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes

# ---------- 内存管理 ----------
# 内存上限：按服务器内存调整（14G 服务器可给 1G~4G）
maxmemory 1gb
# 只淘汰带 TTL 的键（会话/验证码/在线状态/缓存），不误删无 TTL 的键；
# 若业务缓存键普遍无 TTL，可改 allkeys-lru
maxmemory-policy volatile-lru
maxmemory-samples 10

# ---------- 惰性删除：大键释放放到后台线程，避免主线程卡顿 ----------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ---------- 内存碎片整理（长时间运行有效） ----------
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# ---------- 客户端与日志 ----------
maxclients 10000
loglevel notice
# 默认输出到 stdout，由 docker logs 收集
