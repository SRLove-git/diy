# 开发环境：仅基础设施容器化，Node 服务在宿主机直接运行（热更新）
# 用法：docker compose -f docker/compose.dev.yml up -d
# 注意：聊天 WebSocket 与 HTTP 共用宿主 server 的 3000 端口（path /ws），
#       该端口由宿主 Node 进程直接监听，无需在 compose 中额外暴露；
#       在线状态依赖 Redis（chat:online:*），已包含在本编排中。
services:
  mysql:
    image: mysql:8.0
    container_name: diy-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diy
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      # 开发轻量调优配置（缓冲池/连接数更小，慢查询阈值放宽到 2s）
      - ./mysql/my-dev.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: diy-redis-dev
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    # 持久化与内存策略集中在 redis.conf（与生产同一份，行为一致）
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-dev-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  mysql-dev-data:
  redis-dev-data:
