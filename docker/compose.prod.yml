# 生产环境：全链路容器化（MySQL + Redis + server + admin）
# 用法：docker compose -f docker/compose.prod.yml up -d --build
# 注意：server 默认 3 个副本（deploy.replicas: 3，Compose v2+ 支持），无需每次 --scale；
#      需要调整副本数时：--scale server=N
# 镜像 tag：./docker/upgrade.sh 构建时自动使用 diy-server:<日期>-<git短sha> 并同步 :latest，
#      旧 tag 保留最近 3 个（KEEP_TAGS 可覆盖）；手动构建用 ${SERVER_IMAGE:-diy-server:latest}
# 注意：正式部署时以环境变量/密钥管理注入 DB 密码与 JWT_SECRET
services:
  mysql:
    image: mysql:8.0
    container_name: diy-mysql-prod
    restart: unless-stopped
    # 内存上限：缓冲池 4G（14G 生产机约 29%）+ InnoDB 附属结构/连接缓冲，6G 留足余量
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: diy
      TZ: Asia/Shanghai
    volumes:
      - mysql-prod-data:/var/lib/mysql
      # 调优参数集中在 my.cnf（缓冲池/连接数/慢查询等），改后需 --force-recreate 重建
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: diy-redis-prod
    restart: unless-stopped
    # 内存上限：maxmemory 1G + 分配器碎片余量
    mem_limit: 1.5g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
    # 持久化与内存策略集中在 redis.conf（AOF + RDB 兜底、volatile-lru 淘汰）
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-prod-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  server:
    image: ${SERVER_IMAGE:-diy-server:latest}
    build:
      context: ../server
    restart: unless-stopped
    # 内存上限：当前 node 实际 ~120M，5000+ 桌位查询与压测峰值留 6 倍余量
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 多实例：默认 3 副本（deploy.replicas，Compose v2+ 无需 --scale），
    # 外部 3000 由 nginx-lb 负载均衡到各副本；聊天跨实例转发由 Redis pub/sub（chat:events）承载。
    deploy:
      replicas: 3
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: diy
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # TypeORM 连接池：每副本默认 100，需与 mysql max_connections 匹配（500）
      DB_POOL_SIZE: ${DB_POOL_SIZE:-100}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me}
      # JWT 无缝轮换：历史密钥（逗号分隔，仅验签）。
      # 先把旧密钥填到这里再换 JWT_SECRET，已登录用户不掉线；轮换完成后清空
      JWT_LEGACY_SECRETS: ${JWT_LEGACY_SECRETS:-}
      # CORS 白名单（逗号分隔）；不配置则默认禁止跨域（原生 App 不受影响）
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 内容机审关键词（逗号分隔），管理端可运行时增删
      CONTENT_KEYWORDS: ${CONTENT_KEYWORDS:-}
      # 生产 schema 由迁移管理：启动时自动执行 migrations/ 中的迁移（含首次建表）
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      # 反代后识别真实客户端 IP（按 IP 限流依赖）
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # 安全模块（验证码/限流/爬虫拦截/注册限制）
      THROTTLE_DISABLED: ${THROTTLE_DISABLED:-false}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_BLOCK_MS: ${THROTTLE_BLOCK_MS:-300000}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_TTL: ${CAPTCHA_TTL:-300}
      CAPTCHA_MAX_ATTEMPTS: ${CAPTCHA_MAX_ATTEMPTS:-3}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET:-}
      BLOCK_BOT_UA: ${BLOCK_BOT_UA:-false}
      REGISTER_IP_MAX: ${REGISTER_IP_MAX:-5}
      REGISTER_IP_WINDOW_H: ${REGISTER_IP_WINDOW_H:-24}
      # SMTP 邮件（验证码）：未配置时开发模式会打印到日志，生产必须配置
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-DIY手作工坊 <no-reply@example.com>}
      # 聊天图片上传目录（挂载持久卷）
      UPLOAD_DIR: /app/uploads
      # 对象存储：local（默认，挂载卷）或 s3（AWS S3 / MinIO / OSS / COS）
      UPLOAD_PROVIDER: ${UPLOAD_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # CDN 缓存刷新：none（默认，不刷新）/ aliyun
      CDN_PROVIDER: ${CDN_PROVIDER:-none}
      ALIYUN_CDN_ACCESS_KEY_ID: ${ALIYUN_CDN_ACCESS_KEY_ID:-}
      ALIYUN_CDN_ACCESS_KEY_SECRET: ${ALIYUN_CDN_ACCESS_KEY_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads-prod-data:/app/uploads

  nginx-lb:
    image: nginx:alpine
    container_name: diy-nginx-lb
    restart: unless-stopped
    # 大响应（5000+ 桌位 JSON）代理缓冲 + 上传流式转发，留足余量
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 负载均衡入口：外部 443（HTTPS）/ 3000（兼容旧 HTTP）→ server 各副本
    # （含 /api、/ws WebSocket、/uploads、/assets/music）
    depends_on:
      - server
    ports:
      - "443:443"
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  admin:
    image: ${ADMIN_IMAGE:-diy-admin:latest}
    build:
      context: ../admin
    container_name: diy-admin-prod
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - nginx-lb
    ports:
      - "8080:80"

  # 每日数据库备份：cron 定时导出 MySQL（mysqldump）+ Redis（RDB 快照），
  # 产物落在独立数据盘 /data/diy-backups/（与数据卷/系统盘分离，卷损坏不影响备份）
  backup:
    image: ${BACKUP_IMAGE:-diy-backup:latest}
    build:
      context: ./backup
    container_name: diy-backup-prod
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      # 低权限备份账号（一次性创建，见 README“数据库备份与恢复”），避免备份使用 root
      MYSQL_USER: ${BACKUP_DB_USER:-backup}
      MYSQL_PASSWORD: ${BACKUP_DB_PASSWORD:?请在 docker/.env 配置 BACKUP_DB_PASSWORD}
      MYSQL_DATABASE: diy
      REDIS_HOST: redis
      BACKUP_DIR: /backups
      # 保留天数（默认 7 天），改 .env 的 BACKUP_RETENTION_DAYS 生效
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # 每日凌晨 3 点（容器时区 Asia/Shanghai）；表达式在 BACKUP_CRON 中覆盖
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /data/diy-backups:/backups
    healthcheck:
      # 健康判定：最近 48h 内有成功备份（.last-success 时间戳）
      test: ["CMD-SHELL", "[ -f /backups/.last-success ] && [ $$(( $$(date +%s) - $$(cat /backups/.last-success) )) -lt 172800 ]"]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 120s

volumes:
  mysql-prod-data:
  redis-prod-data:
  uploads-prod-data:
