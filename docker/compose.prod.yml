# 生产环境：全链路容器化（MySQL + Redis + server + admin）
# 用法：docker compose -f docker/compose.prod.yml up -d --build
# 注意：正式部署时以环境变量/密钥管理注入 DB 密码与 JWT_SECRET
services:
  mysql:
    image: mysql:8.0
    container_name: diy-mysql-prod
    restart: unless-stopped
    command:
      - --slow-query-log=1
      - --long-query-time=1
      # 3 个 server 副本 × 100 连接池 + 管理/监控连接，上限需同步放大
      - --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: diy
      TZ: Asia/Shanghai
    volumes:
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: diy-redis-prod
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    # 开启 AOF 持久化：避免容器重启/故障切换导致所有用户 refresh token 失效而掉线重登
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  server:
    image: ${SERVER_IMAGE:-diy-server:latest}
    build:
      context: ../server
    restart: unless-stopped
    # 多实例扩容：docker compose -f docker/compose.prod.yml up -d --scale server=3，
    # 外部 3000 由 nginx-lb 负载均衡到各副本；聊天跨实例转发由 Redis pub/sub（chat:events）承载。
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: diy
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # TypeORM 连接池：每副本默认 100，需与 mysql max_connections 匹配（500）
      DB_POOL_SIZE: ${DB_POOL_SIZE:-100}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me}
      # CORS 白名单（逗号分隔）；不配置则默认禁止跨域（原生 App 不受影响）
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 内容机审关键词（逗号分隔），管理端可运行时增删
      CONTENT_KEYWORDS: ${CONTENT_KEYWORDS:-}
      # 生产 schema 由迁移管理：启动时自动执行 migrations/ 中的迁移（含首次建表）
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      # 反代后识别真实客户端 IP（按 IP 限流依赖）
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # SMTP 邮件（验证码）：未配置时开发模式会打印到日志，生产必须配置
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-DIY手作工坊 <no-reply@example.com>}
      # 聊天图片上传目录（挂载持久卷）
      UPLOAD_DIR: /app/uploads
      # 对象存储：local（默认，挂载卷）或 s3（AWS S3 / MinIO / OSS / COS）
      UPLOAD_PROVIDER: ${UPLOAD_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads-prod-data:/app/uploads

  nginx-lb:
    image: nginx:alpine
    container_name: diy-nginx-lb
    restart: unless-stopped
    # 负载均衡入口：外部 3000 → server 各副本（含 /api、/ws WebSocket、/uploads、/assets/music）
    depends_on:
      - server
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  admin:
    image: ${ADMIN_IMAGE:-diy-admin:latest}
    build:
      context: ../admin
    container_name: diy-admin-prod
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - nginx-lb
    ports:
      - "8080:80"

volumes:
  mysql-prod-data:
  redis-prod-data:
  uploads-prod-data:
