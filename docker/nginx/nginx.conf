# WebSocket 握手时传 Upgrade，普通请求传 close，避免 /ws 上无条件带 upgrade 头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ===== 限流（反爬/防刷兜底，应用层限流之外的粗粒度防线） =====
# 全站 API：30 req/s/IP，突发 60；认证接口：2 req/s/IP，突发 5
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# 动态内容（API JSON 等）压缩，移动端流量收益明显
gzip on;
gzip_comp_level 5;
gzip_min_length 1k;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/vnd.ms-fontobject font/ttf font/opentype font/woff font/woff2;

# 不暴露 nginx 版本号
server_tokens off;

# ===== 对外域名 HTTP 统一 301 到 HTTPS =====
# 只匹配 diy.medical-sg.com，不影响 admin 通过 nginx-lb:80 的内部回源
server {
    listen 80;
    server_name diy.medical-sg.com;
    return 301 https://$host$request_uri;
}

# ===== 默认 80：内部回源（admin → nginx-lb:80）与兼容旧 HTTP 访问 =====
server {
    listen 80 default_server;
    server_name _;
    # 短视频上传最高 1GB（与 server 端 multer 限制一致）
    client_max_body_size 1g;
    # 慢客户端兜底超时，防止空闲连接长期占用 worker
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    # 大 JSON/大响应（如门店详情返回 5000+ 桌位）缓冲到内存，减少临时文件写盘
    proxy_buffers 32 32k;
    proxy_buffer_size 8k;
    proxy_busy_buffers_size 64k;

    # Docker 内置 DNS：每次按 server 服务名重新解析，返回各副本 IP（轮询），
    # 配合 --scale server=N 实现负载均衡；valid=10s 控制解析缓存时长。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 隐私政策静态页（docs/PRIVACY_POLICY.md 渲染）
    location = /privacy {
        # 直接返回文件而非 301（避免跳转丢失 Host 端口）；
        # 用 root+try_files 保证按 .html 扩展名返回 text/html（alias 到文件会变成 octet-stream 导致浏览器下载）
        root /usr/share/nginx/html;
        try_files /privacy/index.html =404;
        # 防止浏览器沿用旧 octet-stream 缓存（页面更新走新 ETag 全量重取）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /privacy/ {
        alias /usr/share/nginx/html/privacy/;
        index index.html;
    }
    # 技术支持页（App Store 要求填写 Support URL）
    location = /support {
        root /usr/share/nginx/html;
        try_files /support/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /support/ {
        alias /usr/share/nginx/html/support/;
        index index.html;
    }

    # 公共反代头：server 端 trust proxy 后 req.ip 取真实客户端 IP（限流依赖）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;

    # REST API（含健康检查 /api/health）
    location /api/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 50;
        # 大文件上传 + 服务端处理耗时较长，放宽代理超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 认证接口单独收紧（注册/登录/刷新，防撞库与批量注册）
    location /api/auth/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 20;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 聊天 WebSocket：需要 Upgrade 头才能完成握手；长连接放宽读超时
    location /ws {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        limit_conn conn_limit 10;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 聊天图片等上传文件静态资源
    location /uploads/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 演示短视频与曲库音频（server 托管）
    location /assets/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ===== 443 HTTPS：对外正式入口（App 使用 https://diy.medical-sg.com） =====
# 对外正式 HTTPS 入口（compose 直接映射宿主 443）
server {
    listen 443 ssl;
    http2 on;
    server_name diy.medical-sg.com;

    ssl_certificate /etc/nginx/certs/diy.medical-sg.com.pem;
    ssl_certificate_key /etc/nginx/certs/diy.medical-sg.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 短视频上传最高 1GB（与 server 端 multer 限制一致）
    client_max_body_size 1g;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_buffers 32 32k;
    proxy_buffer_size 8k;
    proxy_busy_buffers_size 64k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 隐私政策静态页（docs/PRIVACY_POLICY.md 渲染）
