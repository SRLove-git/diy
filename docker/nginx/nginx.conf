# Think Origin server 多副本负载均衡（nginx-lb）
# 外部 3000 → server 服务各副本（docker compose --scale server=N）
# Docker 内置 DNS（127.0.0.11），供 upstream resolve 定期重解析（需位于 http 上下文顶层）
resolver 127.0.0.11 valid=30s ipv6=off;

upstream server_backend {
    # zone + resolve：通过 Docker 内置 DNS 持续解析 server 服务所有副本 IP，
    # 副本扩容/重启后无需 reload 即可感知
    zone server_backend 64k;
    server server:3000 resolve;
}

server {
    listen 80;
    server_name _;

    # 与 server 端 multer 上传限制保持一致
    client_max_body_size 1g;

    location / {
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 聊天 WebSocket：与 HTTP 共用 3000 端口（path /ws），需 Upgrade 头完成握手
    location /ws {
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
