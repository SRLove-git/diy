        proxy_http_version 1.1;
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn conn_limit 50;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 认证接口单独收紧（注册/登录/刷新，防撞库与批量注册）
