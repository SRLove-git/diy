# WebSocket 握手时传 Upgrade，普通请求传 close，避免 /ws 上无条件带 upgrade 头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 动态内容（API JSON 等）压缩，移动端流量收益明显
gzip on;
gzip_comp_level 5;
gzip_min_length 1k;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/vnd.ms-fontobject font/ttf font/opentype font/woff font/woff2;

# 不暴露 nginx 版本号
server_tokens off;

server {
    listen 80;
    server_name _;
    # 短视频上传最高 1GB（与 server 端 multer 限制一致）
    client_max_body_size 1g;
    # 慢客户端兜底超时，防止空闲连接长期占用 worker
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    # 大 JSON/大响应（如门店详情返回 5000+ 桌位）缓冲到内存，减少临时文件写盘
    proxy_buffers 32 32k;
    proxy_buffer_size 8k;
    proxy_busy_buffers_size 64k;

    # Docker 内置 DNS：每次按 server 服务名重新解析，返回各副本 IP（轮询），
    # 配合 --scale server=N 实现负载均衡；valid=10s 控制解析缓存时长。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 公共反代头：server 端 trust proxy 后 req.ip 取真实客户端 IP（限流依赖）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;

    # REST API（含健康检查 /api/health）
    location /api/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        # 大文件上传 + 服务端处理耗时较长，放宽代理超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 聊天 WebSocket：需要 Upgrade 头才能完成握手；长连接放宽读超时
    location /ws {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 聊天图片等上传文件静态资源
    location /uploads/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 演示短视频与曲库音频（server 托管）
    location /assets/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
