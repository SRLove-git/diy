server {
    listen 80;
    server_name _;
    # 短视频上传最高 1GB（与 server 端 multer 限制一致）
    client_max_body_size 1g;

    # Docker 内置 DNS：每次按 server 服务名重新解析，返回各副本 IP（轮询），
    # 配合 --scale server=N 实现负载均衡；valid=10s 控制解析缓存时长。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # REST API（含健康检查 /api/health）
    location /api/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传 + 服务端处理耗时较长，放宽代理超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 聊天 WebSocket：需要 Upgrade 头才能完成握手；长连接放宽读超时
    location /ws {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 聊天图片等上传文件静态资源
    location /uploads/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 演示短视频与曲库音频（server 托管）
    location /assets/ {
        set $lb_upstream http://server:3000;
        proxy_pass $lb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
